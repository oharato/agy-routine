# タスク実行スケジュール (systemd OnCalendar 形式)
# 例: 
#   毎日 03:00             -> *-*-* 03:00:00
#   平日 09:00             -> Mon..Fri *-*-* 09:00:00
#   毎週月曜 10:00         -> Mon *-*-* 10:00:00
#   毎時間 0分             -> *-*-* *:00:00
SCHEDULE="Mon..Fri *-*-* 09:00:00"

# エージェントの思考レベル (low | medium | high)
# 定期監視やサマリなら low または medium が推奨
EFFORT="medium"

# 最大タイムアウト秒数 (デフォルト: 600秒 = 10分)
TIMEOUT=600

# タスクの有効/無効 (true | false)
ENABLED="true"
